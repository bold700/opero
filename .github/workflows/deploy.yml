name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechten die de Pages-deploy nodig heeft.
permissions:
  contents: read
  pages: write
  id-token: write

# Eén deploy tegelijk; nieuwere pushes mogen een lopende run vervangen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads `packageManager` from
      # package.json (pnpm@9.15.9). Pinning it in both places makes
      # pnpm/action-setup fail outright with ERR_PNPM_BAD_PM_VERSION, so
      # package.json stays the single source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        env:
          BUILD_TARGET: pages
        # Monorepo: bouw alleen de client. De backend heeft een DB nodig en hoort
        # niet in de Pages-export. Wordt in Phase 11 vervangen door echte deploys.
        run: pnpm --filter @opero/client build

      # Vite writes to client/dist. This said client/out, which was the Next.js
      # export directory — on a clean CI checkout that path doesn't exist, so
      # the touch below failed and there was nothing to upload.
      - run: touch client/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
