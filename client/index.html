<!doctype html>
<!--
  translate="no" + the "notranslate" meta below opt the app OUT of browser
  auto-translation (Chrome offers to translate because lang is "nl"). The app is
  already fully localized NL/EN through i18n, so machine translation on top is
  both unwanted AND unsafe: it rewrites text nodes underneath React, which then
  crashes on the next re-render ("removeChild: node is not a child of this
  node"). Opting out fixes that class of crash across the whole app.
-->
<html lang="nl" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6750A4" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Opero" />
    <title>Opero</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
